version: '3.9'

services:
  # ========== PostgreSQL Database ==========
  postgres:
    image: postgres:15-alpine
    container_name: skill_connect_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-skill_connect_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d skill_connect_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skill_connect_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== MinIO Object Storage ==========
  minio:
    image: minio/minio:latest
    container_name: skill_connect_minio_prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-https://minio.yourdomain.com}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_URL:-https://minio-console.yourdomain.com}
    volumes:
      - minio_data_prod:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - skill_connect_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Backend Node.js Server ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skill_connect_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # App Configuration
      NODE_ENV: production
      PORT: 5000
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-skill_connect_db}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      
      # MinIO Configuration
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-skill-connect-bucket}
      
      # Email Service - SendPulse (Primary)
      SENDPULSE_HOST: ${SENDPULSE_HOST:-smtp.sendpulse.com}
      SENDPULSE_PORT: ${SENDPULSE_PORT:-587}
      SENDPULSE_USER: ${SENDPULSE_USER}
      SENDPULSE_PASS: ${SENDPULSE_PASS}
      SENDPULSE_MAX_USERS: ${SENDPULSE_MAX_USERS:-300}
      SENDPULSE_MAX_EMAILS: ${SENDPULSE_MAX_EMAILS:-12000}
      
      # Email Service - Mailpilt (Fallback)
      MAILPILT_API_KEY: ${MAILPILT_API_KEY}
      MAILPILT_DOMAIN: ${MAILPILT_DOMAIN}
      
      # Admin Configuration
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@skillconnect.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      
      # JWT Secret for Sessions
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      
      # CORS Configuration
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yourdomain.com}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - skill_connect_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ========== Frontend React App ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-https://api.yourdomain.com}
        REACT_APP_ENV: production
    container_name: skill_connect_frontend_prod
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      REACT_APP_API_URL: ${REACT_APP_API_URL:-https://api.yourdomain.com}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - skill_connect_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Nginx Reverse Proxy (Optional) ==========
  nginx:
    image: nginx:alpine
    container_name: skill_connect_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - skill_connect_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
    driver: local
  minio_data_prod:
    driver: local

networks:
  skill_connect_network_prod:
    driver: bridge
